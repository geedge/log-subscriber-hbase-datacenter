#管理kafka地址
bootstrap.servers=192.168.40.132:9092

#从kafka哪里开始读：earliest/latest
auto.offset.reset=latest

#分中心 hbase zookeeper地址
center.hbase.zookeeper.servers=192.168.40.131:2181

#国家中心 hbase zookeeper
national.hbase.zookeeper.servers=192.168.40.132:2181

#hbase table name
hbase.table.name=subscriber_info

#tick时钟频率
topology.tick.tuple.freq.secs=300

topology.config.max.spout.pending=500000

topology.num.acks=0

#kafka broker下的topic名称
kafka.topic=RADIUS-RECORD-LOG

#kafka消费group id
group.id=account-to-hbase-a

#storm topology workers
topology.workers=1

#storm spout parallelism
spout.parallelism=1

#storm bolt parallelism
format.bolt.parallelism=1
